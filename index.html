<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bangla Graphics | Cinematic Brutalism Portfolio</title>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Anek+Bangla:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM (production versions) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  
  <!-- Framer Motion -->
  <script src="https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      background-color: #030303;
      font-family: 'Anek Bangla', sans-serif;
      overflow-x: hidden;
    }
    
    .font-anton {
      font-family: 'Anton', sans-serif;
      letter-spacing: 0.02em;
    }
    
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
      50% { transform: translateY(-20px) rotate(5deg); opacity: 1; }
    }
    
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
      50% { transform: translateY(15px) rotate(-5deg); opacity: 1; }
    }
    
    @keyframes marqueeScroll {
      0% { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    
    @keyframes loaderProgress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    
    .float-slow {
      animation: float1 4s ease-in-out infinite;
    }
    
    .float-fast {
      animation: float2 3s ease-in-out infinite;
    }
    
    .marquee-track {
      display: inline-block;
      white-space: nowrap;
      animation: marqueeScroll 22s linear infinite;
    }
    
    .pulse-animation {
      animation: pulse 2s ease-in-out infinite;
    }
    
    .glass-nav {
      background: rgba(3, 3, 3, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(249, 115, 22, 0.3);
    }
    
    .service-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .service-card:hover {
      background-color: #f97316 !important;
      transform: translateY(-5px);
    }
    
    .service-card:hover .service-icon {
      color: white !important;
    }
    
    .service-card:hover .service-title {
      color: white !important;
    }
    
    .service-card:hover .service-desc {
      color: rgba(255, 255, 255, 0.9) !important;
    }
    
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #111;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #f97316;
      border-radius: 4px;
    }
    
    .hover-glow:hover {
      box-shadow: 0 0 25px rgba(249, 115, 22, 0.4);
    }
    
    .bkash-gradient {
      background: linear-gradient(135deg, #f97316 0%, #f43f5e 50%, #ec4899 100%);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    // Wait for everything to load
    window.addEventListener('load', function() {
      
      // Check if React is loaded
      if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
        document.getElementById('root').innerHTML = '<div style="color:white; text-align:center; margin-top:50px;">Loading dependencies...</div>';
        return;
      }
      
      const { createElement, useState, useEffect, useRef } = React;
      
      // Assets
      const LOGO_URL = "https://www.image2url.com/r2/default/images/1777789492779-ebcf5f7a-624f-4fe7-b206-d2360a28a681.png";
      const WELCOME_AUDIO_URL = "https://www.image2url.com/r2/default/audio/1777792155298-3c8060b1-c527-4848-af53-cdf535d3b4f4.mp3";
      const CLICK_SOUND_URL = "https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3";
      const PORTFOLIO_IMGS = [
        "https://images.unsplash.com/photo-1626785774573-4b799315345d?w=800&h=600&fit=crop",
        "https://images.unsplash.com/photo-1558655146-d09347e92766?w=800&h=600&fit=crop",
        "https://images.unsplash.com/photo-1551288049-bbbda5366391?w=800&h=600&fit=crop",
        "https://images.unsplash.com/photo-1581291518633-83b4ebd1d83e?w=800&h=600&fit=crop"
      ];
      
      // Translations
      const translations = {
        en: {
          brand: "BANGLA GRAPHICS",
          marqueeText: "⚡ 30% ADVANCE PAYMENT REQUIRED BEFORE ANY PROJECT ⚡",
          services: ["Logo Design", "UI/UX Design", "Print Media", "Motion Graphics", "Brand Strategy", "3D Visualization"],
          whatsapp: "WHATSAPP",
          facebook: "FACEBOOK",
          bkash: "bKash",
          bkashNum: "017179727508",
          contactTitle: "CONNECT WITH US",
          portfolioTitle: "VISUAL IMPACT",
          serviceTitle: "OUR SERVICES"
        },
        bn: {
          brand: "বাংলা গ্রাফিক্স",
          marqueeText: "⚡ যেকোন প্রজেক্ট শুরু করার আগে ৩০% অগ্রিম পেমেন্ট প্রয়োজন ⚡",
          services: ["লোগো ডিজাইন", "UI/UX ডিজাইন", "প্রিন্ট মিডিয়া", "মোশন গ্রাফিক্স", "ব্র্যান্ড স্ট্র্যাটেজি", "৩ডি ভিজুয়ালাইজেশন"],
          whatsapp: "হোয়াটসঅ্যাপ",
          facebook: "ফেসবুক",
          bkash: "বিকাশ",
          bkashNum: "০১৭১৭৯৭২৭৫০৮",
          contactTitle: "যোগাযোগ করুন",
          portfolioTitle: "ভিজুয়াল ইমপ্যাক্ট",
          serviceTitle: "আমাদের সেবা"
        }
      };
      
      // Service Icons
      const serviceIcons = ["🎨", "💻", "🖨️", "🎬", "📊", "🎮"];
      
      // Floating icons data
      const floatingIcons = [
        { icon: "⚡", top: "10%", left: "5%", anim: "float-slow" },
        { icon: "⭐", top: "15%", left: "88%", anim: "float-fast" },
        { icon: "✨", top: "70%", left: "92%", anim: "float-slow" },
        { icon: "💎", top: "80%", left: "6%", anim: "float-fast" },
        { icon: "🎯", top: "45%", left: "3%", anim: "float-slow" },
        { icon: "⚡", top: "60%", left: "87%", anim: "float-fast" }
      ];
      
      // Main App Component
      const App = () => {
        const [lang, setLang] = useState('bn');
        const [loading, setLoading] = useState(true);
        const [progress, setProgress] = useState(0);
        const [audioEnabled, setAudioEnabled] = useState(false);
        const welcomeAudio = useRef(null);
        const clickAudio = useRef(null);
        
        // Loading simulation
        useEffect(() => {
          const interval = setInterval(() => {
            setProgress(prev => {
              const newProgress = prev + Math.random() * 15 + 5;
              if (newProgress >= 100) {
                clearInterval(interval);
                setTimeout(() => setLoading(false), 500);
                return 100;
              }
              return newProgress;
            });
          }, 120);
          
          return () => clearInterval(interval);
        }, []);
        
        // Initialize audio
        useEffect(() => {
          welcomeAudio.current = new Audio(WELCOME_AUDIO_URL);
          welcomeAudio.current.volume = 0.5;
          welcomeAudio.current.loop = false;
          
          clickAudio.current = new Audio(CLICK_SOUND_URL);
          clickAudio.current.volume = 0.3;
        }, []);
        
        // Handle first user interaction
        const handleFirstInteraction = () => {
          if (!audioEnabled && welcomeAudio.current) {
            welcomeAudio.current.play().then(() => {
              setAudioEnabled(true);
            }).catch(err => console.log('Audio play requires user interaction first'));
          }
          
          if (clickAudio.current && audioEnabled) {
            clickAudio.current.currentTime = 0;
            clickAudio.current.play().catch(err => console.log('Click sound error'));
          }
        };
        
        useEffect(() => {
          document.body.addEventListener('click', handleFirstInteraction);
          return () => document.body.removeEventListener('click', handleFirstInteraction);
        }, [audioEnabled]);
        
        const t = translations[lang];
        
        // Loading Screen
        if (loading) {
          return createElement('div', { 
            className: "fixed inset-0 bg-[#030303] flex flex-col items-center justify-center z-50",
            style: { backgroundColor: '#030303' }
          },
            createElement('img', { 
              src: LOGO_URL, 
              className: "w-28 h-28 md:w-32 md:h-32 object-contain mb-8 pulse-animation",
              alt: "Bangla Graphics Logo"
            }),
            createElement('div', { className: "w-64 h-1.5 bg-white/10 rounded-full overflow-hidden" },
              createElement('div', { 
                className: "h-full bg-[#f97316] rounded-full transition-all duration-200",
                style: { width: `${progress}%` }
              })
            ),
            createElement('p', { className: "text-white/40 mt-5 font-mono text-sm" }, `LOADING ${Math.floor(progress)}%`),
            createElement('p', { className: "text-orange-500/60 text-xs mt-3 font-anton tracking-wider" }, "CINEMATIC BRUTALISM")
          );
        }
        
        // Main content
        return createElement('div', { className: "bg-[#030303] text-white relative min-h-screen" },
          // Fixed Marquee Banner
          createElement('div', { 
            className: "fixed top-0 left-0 w-full bg-[#f97316] py-2.5 z-50 overflow-hidden shadow-lg",
            style: { zIndex: 50 }
          },
            createElement('div', { className: "marquee-track inline-flex gap-8 px-4" },
              Array(6).fill(null).map((_, i) => 
                createElement('span', { key: i, className: "text-black font-black text-sm md:text-base uppercase tracking-widest font-anton" }, 
                  t.marqueeText + "  "
                )
              )
            )
          ),
          
          // Glass Navigation
          createElement('nav', { 
            className: "glass-nav fixed left-0 w-full z-40 py-3 px-6 md:px-12 flex justify-between items-center",
            style: { top: "46px" }
          },
            createElement('div', { className: "flex items-center gap-3" },
              createElement('img', { src: LOGO_URL, className: "h-10 w-10 rounded-full object-cover border-2 border-orange-500" }),
              createElement('span', { className: "font-anton text-xl tracking-wider hidden sm:inline-block text-white" }, "BANGLA")
            ),
            createElement('div', { className: "flex gap-4 items-center" },
              createElement('button', {
                onClick: () => setLang(lang === 'bn' ? 'en' : 'bn'),
                className: "bg-black/60 backdrop-blur px-4 py-1.5 rounded-full text-sm font-bold border border-orange-500 text-orange-400 hover:bg-orange-600 hover:text-white transition-all duration-300 cursor-pointer"
              }, lang === 'bn' ? 'ENGLISH' : 'বাংলা')
            )
          ),
          
          // Main Content Area
          createElement('main', { className: "pt-36 md:pt-44 pb-24 px-5 md:px-10 max-w-7xl mx-auto" },
            
            // Hero Section
            createElement('section', { className: "relative mb-32 mt-4 text-center" },
              // Floating animated icons
              ...floatingIcons.map((item, idx) => 
                createElement('div', {
                  key: idx,
                  className: `absolute text-3xl md:text-5xl text-orange-400/80 ${item.anim}`,
                  style: { 
                    top: item.top, 
                    left: item.left,
                    filter: 'drop-shadow(0 0 8px #f97316)',
                    zIndex: 10
                  }
                }, item.icon)
              ),
              
              // Hero Card
              createElement('div', { 
                className: "max-w-5xl mx-auto bg-gradient-to-br from-black/60 to-black/40 border border-white/10 rounded-3xl p-8 md:p-14 backdrop-blur-md hover-glow transition-all duration-500",
                style: { position: 'relative', zIndex: 20 }
              },
                createElement('div', { className: "flex justify-center mb-8" },
                  createElement('img', { 
                    src: LOGO_URL, 
                    className: "w-28 h-28 md:w-36 md:h-36 object-contain rounded-2xl border-2 border-orange-500 p-1.5 bg-black shadow-2xl",
                    style: { boxShadow: '0 0 30px rgba(249,115,22,0.3)' }
                  })
                ),
                createElement('h1', { 
                  className: "font-anton text-6xl md:text-8xl lg:text-9xl tracking-tighter uppercase leading-[1.1] text-white",
                  style: { textShadow: '0 0 20px rgba(249,115,22,0.5)' }
                }, t.brand),
                createElement('p', { className: "text-orange-400 mt-6 text-lg md:text-xl font-medium tracking-wide" }, 
                  lang === 'bn' ? "প্রিমিয়াম ক্রিয়েটিভ স্টুডিও" : "PREMIUM CREATIVE STUDIO"
                )
              )
            ),
            
            // Portfolio Grid Section
            createElement('div', { id: "portfolio", className: "mb-36" },
              createElement('h2', { 
                className: "font-anton text-5xl md:text-7xl mb-10 text-white border-l-[10px] border-orange-500 pl-6 leading-tight" 
              }, t.portfolioTitle),
              createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                PORTFOLIO_IMGS.map((img, idx) => 
                  createElement('div', {
                    key: idx,
                    className: "group relative overflow-hidden aspect-[4/3] bg-neutral-900 border-2 border-white/5 rounded-xl hover:border-orange-500 transition-all duration-500 cursor-pointer hover-glow"
                  },
                    createElement('img', { 
                      src: img, 
                      className: "w-full h-full object-cover transition duration-700 group-hover:scale-110 brightness-90 group-hover:brightness-100" 
                    }),
                    createElement('div', { 
                      className: "absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-500 flex items-end p-6" 
                    },
                      createElement('span', { className: "text-orange-400 font-bold text-lg uppercase tracking-wider font-anton" }, "VIEW CASE →")
                    )
                  )
                )
              )
            ),
            
            // Services Grid Section
            createElement('div', { id: "services", className: "mb-36" },
              createElement('h2', { 
                className: "font-anton text-5xl md:text-7xl mb-12 text-white border-l-[10px] border-orange-500 pl-6" 
              }, t.serviceTitle),
              createElement('div', { className: "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" },
                t.services.map((service, idx) => 
                  createElement('div', {
                    key: idx,
                    className: "service-card bg-black/40 border border-white/10 rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 hover:shadow-2xl"
                  },
                    createElement('div', { className: "service-icon text-6xl mb-5 text-orange-500 transition-all duration-300" }, serviceIcons[idx % serviceIcons.length]),
                    createElement('h3', { className: "service-title font-anton text-2xl md:text-3xl tracking-wide transition-all duration-300" }, service),
                    createElement('p', { className: "service-desc text-gray-400 text-sm mt-3 transition-all duration-300" }, 
                      lang === 'bn' ? "বিস্তারিত জানতে ক্লিক করুন →" : "Click for details →"
                    )
                  )
                )
              )
            ),
            
            // Contact & Payment Section
            createElement('div', { className: "mb-20" },
              createElement('h2', { className: "font-anton text-4xl md:text-6xl mb-12 text-center" }, t.contactTitle),
              createElement('div', { className: "grid grid-cols-1 md:grid-cols-3 gap-8" },
                
                // WhatsApp Card
                createElement('a', {
                  href: "https://wa.me/8801717927508",
                  target: "_blank",
                  className: "block bg-gradient-to-br from-black/80 to-black/60 border-2 border-white/10 rounded-2xl p-7 hover:border-green-500 transition-all duration-300 group hover-glow"
                },
                  createElement('div', { className: "flex items-center gap-5" },
                    createElement('div', { className: "text-6xl" }, "💚"),
                    createElement('div', null,
                      createElement('h3', { className: "font-anton text-3xl text-green-400" }, t.whatsapp),
                      createElement('p', { className: "text-gray-300 text-base font-mono mt-1" }, "+880 1717-927508"),
                      createElement('p', { className: "text-green-500/70 text-xs mt-2" }, "24/7 Support")
                    )
                  )
                ),
                
                // Facebook Card
                createElement('a', {
                  href: "https://facebook.com",
                  target: "_blank",
                  className: "block bg-gradient-to-br from-black/80 to-black/60 border-2 border-white/10 rounded-2xl p-7 hover:border-blue-500 transition-all duration-300 group hover-glow"
                },
                  createElement('div', { className: "flex items-center gap-5" },
                    createElement('div', { className: "text-6xl" }, "📘"),
                    createElement('div', null,
                      createElement('h3', { className: "font-anton text-3xl text-blue-400" }, t.facebook),
                      createElement('p', { className: "text-gray-300 text-base mt-1" }, "/bangladeshgraphics")
                    )
                  )
                ),
                
                // bKash Card (Gradient)
                createElement('div', {
                  className: "block bkash-gradient rounded-2xl p-7 shadow-2xl hover-glow transition-all duration-300 cursor-pointer",
                  style: { boxShadow: '0 10px 40px rgba(236, 72, 153, 0.3)' }
                },
                  createElement('div', { className: "flex items-center gap-5" },
                    createElement('div', { className: "text-6xl drop-shadow-lg" }, "💸"),
                    createElement('div', null,
                      createElement('h3', { className: "font-anton text-3xl text-white" }, t.bkash),
                      createElement('p', { className: "text-white text-xl font-bold tracking-wider font-mono mt-1" }, t.bkashNum),
                      createElement('p', { className: "text-white/90 text-sm font-semibold mt-2" }, 
                        lang === 'bn' ? "✔ মার্চেন্ট ও ব্যক্তিগত" : "✔ Merchant & Personal"
                      )
                    )
                  )
                )
              )
            )
          ),
          
          // Footer
          createElement('footer', { className: "border-t border-white/10 py-10 text-center px-5 mt-10" },
            createElement('p', { className: "text-gray-500 text-sm font-mono" }, "© 2025 BANGLA GRAPHICS — CINEMATIC BRUTALISM STUDIO"),
            createElement('p', { className: "text-orange-500/50 text-xs mt-2" }, "PREMIUM DESIGN • BOLD VISION")
          )
        );
      };
      
      // Render the app
      const rootElement = document.getElementById('root');
      const reactRoot = ReactDOM.createRoot(rootElement);
      reactRoot.render(createElement(App));
    });
  </script>
</body>
</html>
